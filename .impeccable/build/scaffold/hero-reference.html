<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:wght@700&family=Bentham:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#091629}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:768px">
  <div class="r-header-logo region chrome" data-region="header-logo"><!-- Wander wordmark with a small star, white on the night-sky page ground; the client's logo lockup replaces it --></div>
  <div class="r-header-cta region control" data-region="header-cta"><!-- engraved brass door plaque button reading What's on, two screw heads, dark engraved lettering: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop header-cta); a control need not have button chrome --></div>
  <figure class="r-facade region plate" data-region="facade"><img src="../../../assets/plates/facade.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-glow-dormer-left region plate" data-region="glow-dormer-left"><img src="../../../assets/plates/glow-dormer-left.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-glow-dormer-right region plate" data-region="glow-dormer-right"><img src="../../../assets/plates/glow-dormer-right.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-glow-dining region plate" data-region="glow-dining"><img src="../../../assets/plates/glow-dining.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-glow-living region plate" data-region="glow-living"><img src="../../../assets/plates/glow-living.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-glow-door region plate" data-region="glow-door"><img src="../../../assets/plates/glow-door.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-snow-ground region plate" data-region="snow-ground"><img src="../../../assets/plates/snow-ground.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-headline region text" data-region="headline"><!-- two-line headline Winter is made / for wandering, heavy friendly serif, snow white, centred --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- one-line subline A holiday escape to St. Catharines and the Benchlands., same serif, smaller, snow white, centred --><p style="font-size:var(--r-subline-font);font-family:var(--r-subline-family),sans-serif;font-weight:var(--r-subline-weight);line-height:1.05;margin:0">subline</p></div>
  <div class="r-section-heading region text" data-region="section-heading"><!-- section heading Choose a room, heavy serif, white, centred on the navy section ground --><p style="font-size:var(--r-section-heading-font);line-height:1.05;margin:0">section-heading</p></div>
  <div class="r-plaque-1 region control" data-region="plaque-1"><!-- brass door plaque link What's on this winter: notched-corner brass bar, two screw heads, dark engraved lettering centred: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop plaque-1); a control need not have button chrome --></div>
  <div class="r-plaque-2 region control" data-region="plaque-2"><!-- brass door plaque link Eat, drink and shop, same plaque form: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop plaque-2); a control need not have button chrome --></div>
  <div class="r-plaque-2-label region text" data-region="plaque-2-label"><!-- engraved plaque label Eat, drink and shop, dark ink on brass, centred --><p style="font-size:var(--r-plaque-2-label-font);line-height:1.05;margin:0">plaque-2-label</p></div>
  <div class="r-plaque-3 region control" data-region="plaque-3"><!-- brass door plaque link Winter outdoors, same plaque form: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop plaque-3); a control need not have button chrome --></div>
  <div class="r-plaque-4 region control" data-region="plaque-4"><!-- brass door plaque link Stay the night, same plaque form, cut by the bottom edge of the viewport (a fifth plaque, Winter reading, follows below the fold): match the control's lettering and visible shape to the crop (comp-spec.mjs --crop plaque-4); a control need not have button chrome --></div>
  <div class="r-brass-texture region texture" data-region="brass-texture" style="background-image:url('../../../assets/plates/brass-texture.png');background-repeat:repeat"></div>
  <figure class="r-evergreen-left region plate" data-region="evergreen-left"><img src="../../../assets/plates/evergreen-left.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-evergreen-right region plate" data-region="evergreen-right"><img src="../../../assets/plates/evergreen-right.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
