name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Least-privilege permissions for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Client preview lives at the GitHub Pages project URL (no custom domain
      # yet), so the build needs the repo-name path prefix. When a custom
      # domain is wired up later: restore src/CNAME and drop the --pathprefix.
      # SHOW_PLACEHOLDERS renders labelled slot placeholders in the client preview
      - run: npx @11ty/eleventy --pathprefix=/wander-niagara-fall/
        env:
          SHOW_PLACEHOLDERS: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
