name: PR build check

# Every PR gets a build check so broken templates never reach main.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm key pages built
        run: |
          for p in index couples families events stories directory; do
            test -f "_site/$p/index.html" -o -f "_site/index.html" || { echo "Missing $p"; exit 1; }
          done
          # No custom domain yet — the preview lives at the GitHub Pages project
          # URL. Restore this CNAME assertion when a real domain is wired up:
          # test -f _site/CNAME || { echo "Missing CNAME in build output"; exit 1; }
          echo "Build check passed."
